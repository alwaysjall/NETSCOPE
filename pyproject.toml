[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "noctura-netscope"
dynamic = ["version"]
description = "Noctura NETSCOPE - toolkit diagnostik jaringan yang cantik untuk terminal"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["network", "dns", "ssl", "diagnostics", "termux", "kali", "cli"]
dependencies = ["rich>=13.0", "requests>=2.28", "dnspython>=2.3"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "cryptography>=41.0"]

[project.scripts]
netscope = "netscope.main:main"

[tool.setuptools]
packages = ["netscope", "netscope.modules"]

[tool.setuptools.dynamic]
version = { attr = "netscope.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
